apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-cicd-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: devops-cicd-app
  template:
    metadata:
      labels:
        app: devops-cicd-app
    spec:
      containers:
        - name: devops-cicd-app
          image: devops-cicd-w9-t2:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
